<!doctype html>
<!-- Self-test page: one instance of every problem duo-audit looks for. Each is labelled with the check it should trip. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broken on purpose</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #111; color: #111; }       /* background: dark body, light page */
  main, section, footer { background: #f6f4ee; }
  header { position: sticky; top: 0; height: 64px; background: #fff; display: flex; align-items: center; justify-content: space-between;
           padding: env(safe-area-inset-top) 16px 0; }                                                    /* top-inset */
  .wrap { padding: 0 env(safe-area-inset-left); }                                                        /* insets: one edge for both */
  .links a { margin-left: 12px; }
  .menu { position: relative; display: inline-block; }
  .menu:hover > .sub { display: block; }                                                                 /* hover */
  .sub { display: none; position: absolute; top: 100%; right: 0; background: #fff; }
  .hero { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }    /* vh */
  .lone { display: inline-block; width: 180px; padding: 14px 0; background: #2b5; color: #fff; border-radius: 10px; text-decoration: none; }  /* crease: centred alone */
  .tools button { margin: 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px; }             /* grid: three equal columns */
  .card { background: #fff; padding: 16px; border-radius: 12px; }
  .wide-thing { width: 420px; height: 40px; background: #fc6; }                                         /* sideways: fixed width */
  .banner { position: fixed; left: 0; right: 0; bottom: 0; height: 120px; background: #222; color: #fff; padding: 16px; }  /* bars, covered */
  html.narrow .tools { display: none; }      /* resize: decided once, at load */
  html.phone .links { display: none; }       /* ua: decided by user agent */
  html.small-screen .grid a { display: none; }  /* screen: decided by screen.width */
</style>
</head>
<body>
<header class="wrap"><strong>Broken Co</strong>
  <nav class="links"><a href="#a">Product</a><a href="#b">Pricing</a><a href="#c">Docs</a><a href="#d">Blog</a>
    <span class="menu"><a href="#m">More</a><span class="sub"><a href="#s1">One</a><a href="#s2">Two</a></span></span></nav>
</header>
<main>
  <section class="hero"><div>
    <h1>Everything breaks here</h1>
    <p><a class="lone" href="#buy">Buy now</a></p>
    <div class="tools"><button>Share</button><button>Save</button><button>Print</button></div>
    <div class="wide-thing"></div>
  </div></section>
  <section class="grid">
    <div class="card"><h3>One</h3><a href="#1">Read one</a></div>
    <div class="card"><h3>Two</h3><a href="#2">Read two</a></div>
    <div class="card"><h3>Three</h3><a href="#3">Read three</a></div>
  </section>
</main>
<footer class="wrap"><p>Footer</p></footer>
<div class="banner">We use cookies. <button>Accept</button></div>
<script>
  const w0 = innerWidth;                                                      // resize: read once
  document.documentElement.classList.add(w0 < 600 ? 'narrow' : 'wide');
  if (/iPhone/.test(navigator.userAgent)) document.documentElement.classList.add('phone');   // ua
  if (screen.width < 600) document.documentElement.classList.add('small-screen');            // screen
</script>
</body>
</html>
